# Run the bats tests under test/ on every push to main and every pull
# request. Ubuntu's awk is mawk, so this also catches parsing that only
# works with macOS's awk.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Run the tests
        run: bats test/
