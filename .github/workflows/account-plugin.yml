# Keep the Account plugin sound on every pull request.
#
# Skills with reach `all` reach my Claude accounts through the `jake-mode`
# plugin this repository serves (see plugins/jake-mode/). This check fails
# when a skill's front matter would break claude.ai, when the plugin's skill
# links disagree with the skills' reach, or when the plugin folder holds
# anything claude.ai would read or refuse. Its run summary also says whether the accounts need a
# Check for updates after merging, since claude.ai does not pull a
# marketplace I added myself on its own.
#
# A pull request is checked as it would merge (GitHub's merge ref, the
# checkout default), not as its head alone: two pull requests can each pass
# on their own and still break the plugin together. Each push to main is
# checked as well, so a break that gets through shows up right away.
#
# The work itself is bin/account-plugin, which also runs locally.

name: account-plugin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: account-plugin-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  account-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Named explicitly so the runner adds pipefail; a check failure in
        # bin/account-plugin must not be hidden by the tee after it.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the Account plugin
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            bin/account-plugin --base "origin/$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            bin/account-plugin | tee -a "$GITHUB_STEP_SUMMARY"
          fi
